<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGPro · Gerador de Propostas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #ececea; color: #1d1d1b; }

/* ---------- barra do app ---------- */
.bar { position: sticky; top: 0; z-index: 10; background: #1d1d1b; color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 18px; flex-wrap: wrap; }
.bar .brand { font-weight: 800; font-size: 15px; }
.bar .brand b { color: #e3242b; }
.bar .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid #555; background: #2b2b29; color: #fff; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
.btn:hover { background: #3a3a38; }
.btn.red { background: #e3242b; border-color: #e3242b; }
.btn.red:hover { background: #c81e24; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.status { font-size: 12px; color: #bdbdbb; }
.sub-bar { background: #2b2b29; color: #cfcfcd; font-size: 12px; padding: 7px 18px; }

.drop { max-width: 640px; margin: 60px auto; background: #fff; border: 2px dashed #b9b9b6; border-radius: 12px; padding: 48px 30px; text-align: center; cursor: pointer; transition: .15s; }
.drop:hover, .drop.over { border-color: #e3242b; background: #fff7f7; }
.drop h2 { font-size: 20px; margin-bottom: 8px; }
.drop p { color: #6b6b6b; font-size: 14px; }
.drop img { height: 70px; margin-bottom: 16px; }

#lista { padding: 24px 0 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.card { width: 297mm; }
.card .pg + .pg { margin-top: 10px; }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: #555; }
.card-top .acts { margin-left: auto; display: flex; gap: 6px; }
.card-top .btn { background: #fff; color: #1d1d1b; border-color: #c9c9c6; padding: 5px 10px; font-size: 12px; }
.card-top .btn:hover { background: #f3f3f1; }
.card-top .warn { color: #c81e24; font-weight: 700; }

/* ---------- página A4 paisagem ---------- */
.pg { width: 297mm; height: 210mm; display: flex; flex-direction: column; overflow: hidden; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.top { display: flex; align-items: center; gap: 5mm; padding: 3.5mm 7mm 2.5mm; }
.top .lg1 { height: 11mm; }
.top .lg2 { height: 11mm; margin-left: auto; }
.top .tt { flex: 1; min-width: 0; border-left: 1.2mm solid #e3242b; padding-left: 4mm; }
.kicker { font-size: 7.5pt; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #e3242b; }
.titulo { font-size: 13pt; font-weight: 800; line-height: 1.15; margin-top: 1mm; }
.num { font-size: 24pt; font-weight: 900; line-height: 1; padding-right: 2mm; text-align: center; }
.num small { display: block; font-size: 6.5pt; letter-spacing: .1em; color: #8a8a8a; font-weight: 700; }
.meta { display: flex; background: #1d1d1b; color: #fff; margin: 0 7mm; border-radius: 2mm; overflow: hidden; }
.meta > div { flex: 1; padding: 1.4mm 3mm; border-right: .3mm solid #3a3a38; min-width: 0; }
.meta > div:last-child { border-right: 0; background: #e3242b; flex: .7; }
.meta b { display: block; font-size: 5.8pt; letter-spacing: .12em; text-transform: uppercase; color: #bdbdbb; font-weight: 700; }
.meta > div:last-child b { color: #ffd6d7; }
.meta span { font-size: 8.5pt; font-weight: 700; line-height: 1.2; display: block; overflow-wrap: anywhere; }
.corpo { flex: 1; min-height: 0; padding: 2.5mm 7mm 1.5mm; display: flex; gap: 3mm; }
.col { flex: 1; min-width: 0; height: 100%; overflow: hidden; font-size: var(--fs); line-height: 1.25; text-align: left; }
.box { background: #f5f5f4; border-radius: 1.4mm; padding: 1.8mm 2.4mm 2mm; margin-bottom: 2.2mm; border-top: .9mm solid #1d1d1b; }
.box.red { border-top-color: #e3242b; }
.box.cont { border-top-style: dashed; }
.box h3 { font-size: 6.6pt; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; margin-bottom: 1.2mm; }
.box h3 i { font-style: normal; color: #e3242b; margin-right: 1.5mm; }
.box > * + * { margin-top: .7mm; }
.box h3 + * { margin-top: 0; }
.box .li { position: relative; padding-left: 3mm; }
.box .li::before { content: ''; position: absolute; left: .6mm; top: .5em; width: 1.1mm; height: 1.1mm; background: #e3242b; border-radius: 50%; }
.corpo.esticar .col { display: flex; flex-direction: column; }
.corpo.esticar .box { flex: 1 1 auto; }
.corpo.esticar .box:last-child { margin-bottom: 0; }
.box .grp > * + * { margin-top: .7mm; }
.box .sub { font-size: .85em; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #6b6b6b; text-align: left; }
.box .p { overflow-wrap: anywhere; }
.vazio { color: #9b9b9b; font-style: italic; }
.rod { display: flex; align-items: center; gap: 4mm; margin: 0 7mm; padding: 1.4mm 0 2mm; font-size: 6.5pt; color: #6b6b6b; border-top: .3mm solid #e2e2e0; }
.rod .r { margin-left: auto; text-align: right; }
.rod .r span { color: #e3242b; }

/* ---------- impressão (PDF com texto selecionável) ---------- */
@page { size: A4 landscape; margin: 0; }
@media print {
  body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar, .sub-bar, .drop, .card-top { display: none !important; }
  #lista { padding: 0; gap: 0; display: block; }
  .card { width: auto; }
  .pg { box-shadow: none; break-after: page; }
  .card .pg + .pg { margin-top: 0; }
  body.so-um .card:not(.imprimir) { display: none; }
}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><b>CGPro</b> · Gerador de Propostas</div>
  <span class="status" id="status"></span>
  <div class="acts">
    <button class="btn" id="bNovo" disabled>Nova planilha</button>
    <button class="btn" id="bPrint" disabled>Imprimir / Salvar PDF</button>
    <button class="btn" id="bPdfAll" disabled>PDF consolidado</button>
    <button class="btn" id="bZip" disabled>PDFs individuais (ZIP)</button>
    <button class="btn red" id="bPptx" disabled>PowerPoint</button>
  </div>
</div>
<div class="sub-bar">Envie o Excel exportado do Forms do Edital. Tudo é processado no seu navegador: a planilha não é enviada para nenhum servidor.</div>

const MM = 96 / 25.4;               // px por mm
const PAGE_W = 297, PAGE_H = 210;   // mm

const fmtFs = f => f.toString().replace('.', ',');

const $ = s => document.querySelector(s);
const status = t => $('#status').textContent = t || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const limpa = v => (v === null || v === undefined) ? '' : String(v).trim();
const norm = s => String(s).replace(/ /g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();

/* ---------- leitura da planilha ---------- */
const CAMPOS = {
  id: 'id', fim: 'hora de conclusão', email: 'email', titulo: 'título da proposta', proponente: 'proponente',
  unidade: 'unidade de exercício', emailInst: 'e-mail institucional', coord: 'coordenador(es) proposto',
  integrantes: 'integrantes inicialmente previstos', perfil: 'caso nem todos', modelagem: 'modelagem sugerida',
  problema: 'problema, necessidade', objetivo: 'objetivo e resultado', beneficio: 'benefício institucional',
  estrategia: 'estratégia de execução', prazo: 'prazo e principais', condicoes: 'condições necessárias',
  riscos: 'riscos e dificuldades', lc: 'licença compensatória', docs: 'documentos complementares'
};

function lerPlanilha(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
  const hi = rows.findIndex(r => r && norm(r[0] ?? '') === 'id');
  if (hi < 0) throw new Error('Não encontrei o cabeçalho (coluna "ID") na planilha.');
  const hdr = rows[hi].map(h => norm(h ?? ''));
  const idx = {};
  for (const [k, pref] of Object.entries(CAMPOS)) {
    idx[k] = k === 'email' ? hdr.findIndex(h => h === 'email') : hdr.findIndex(h => h.startsWith(pref));
  }
  return rows.slice(hi + 1)
    .filter(r => r && r[idx.id] !== null && limpa(r[idx.id]) !== '')
    .map(r => { const o = {}; for (const k in idx) o[k] = idx[k] >= 0 ? r[idx[k]] : null; return o; });
}

/* ---------- formatação do texto ---------- */
function itens(txt) {
  let t = limpa(txt);
  if (!t || /^[-–—.\s]*$/.test(t)) return [{ t: 'p', h: '<span class="vazio">Não informado</span>' }];
  t = t.replace(/(^|\s)o\t/g, '\n• ').replace(/\s*•\s*/g, '\n• ').replace(/\t/g, ' ');
  return t.split(/\n+|\s{3,}/).map(s => s.trim()).filter(Boolean).map(p => {
    const m = p.match(/^(?:[•▪\-–])\s*(.*)$/s);
    return m ? { t: 'li', h: esc(m[1]) } : { t: 'p', h: esc(p) };
  });
}

function duracao(o) {
  const NUM = { um: 1, dois: 2, 'três': 3, quatro: 4, seis: 6, doze: 12, dezoito: 18 };
  for (const c of [o.prazo, o.estrategia]) {
    const t = limpa(c).toLowerCase();
    let m = t.match(/(\d+)\s*a\s*(\d+)\s*(meses|dias)/);
    const m1 = t.match(/(\d+)\s*(?:\([^)]*\)\s*)?(meses|dias)/);
    if (m && (!m1 || m.index <= m1.index)) return `${m[1]} a ${m[2]} ${m[3]}`;
    if (m1) return `${m1[1]} ${m1[2]}`;
    m = t.match(/\b(um|seis|doze|dezoito)\s+(ano|meses)/);
    if (m) return `${NUM[m[1]] * (m[2] === 'ano' ? 12 : 1)} meses`;
  }
  return '—';
}

function dataBR(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : (typeof v === 'number' ? new Date(Math.round((v - 25569) * 864e5)) : new Date(v));
  return isNaN(d) ? '' : d.toLocaleDateString('pt-BR');
}

function nomeAnexo(url) {
  url = limpa(url);
  if (!url) return '';
  try {
    const u = new URL(url);
    return u.searchParams.get('file') || decodeURIComponent(u.pathname.split('/').pop());
  } catch { return ''; }
}

function modelagemCurta(m) {
  m = limpa(m) || '—';
  if (m.length <= 45) return [m, false];
  let c = m.split(/[:;(.]/)[0].trim();
  if (c.length > 45) c = c.slice(0, 42).replace(/\s+\S*$/, '') + '…';
  return [c, true];
}

/* blocos do canvas: [titulo, itens, vermelho] */
function blocos(o) {
  const eq = [];
  if (limpa(o.coord)) eq.push({ t: 'sub', h: 'Coordenação' }, ...itens(o.coord));
  eq.push({ t: 'sub', h: 'Integrantes previstos' }, ...itens(o.integrantes));
  if (limpa(o.perfil)) eq.push({ t: 'sub', h: 'Perfil ainda necessário' }, ...itens(o.perfil));
  const [mc, cortou] = modelagemCurta(o.modelagem);
  if (cortou) eq.push({ t: 'sub', h: 'Modelagem sugerida' }, ...itens(o.modelagem));
  const b = [
    ['Problema, necessidade ou oportunidade', itens(o.problema), true],
    ['Objetivo e resultado pretendido', itens(o.objetivo), true],
    ['Benefício institucional', itens(o.beneficio), true],
    ['Estratégia de execução', itens(o.estrategia)],
    ['Prazo e principais entregas', itens(o.prazo)],
    ['Equipe', eq],
    ['Condições necessárias à execução', itens(o.condicoes)],
    ['Riscos e dificuldades', itens(o.riscos)],
    ['Licença compensatória', itens(o.lc)],
  ];
  return b.map((x, k) => [x[0], x[1], !!x[2], k + 1]);
}

/* ---------- montagem da página ---------- */
function paginaHTML(o, total, parte, partes) {
  const n = String(parseInt(o.id)).padStart(2, '0');
  const anx = nomeAnexo(o.docs);
  return `<div class="pg">
    <div class="top">
      <img class="lg1" src="${LOGO_CGPRO}">
      <div class="num">${n}<small>DE ${total}</small></div>
      <div class="tt">
        <div class="kicker">1º Edital de Chamamento · Atividades Públicas Relevantes${parte > 1 ? ' · continuação' : ''}</div>
        <div class="titulo">${esc(limpa(o.titulo))}</div>
      </div>
      <img class="lg2" src="${LOGO_PGE}">
    </div>
    <div class="meta">
      <div><b>Proponente</b><span>${esc(limpa(o.proponente))}</span></div>
      <div><b>Unidade</b><span>${esc(limpa(o.unidade))}</span></div>
      <div><b>E-mail</b><span>${esc(limpa(o.emailInst) || limpa(o.email))}</span></div>
      <div><b>Modelagem</b><span>${esc(modelagemCurta(o.modelagem)[0])}</span></div>
      <div><b>Duração</b><span>${esc(duracao(o))}</span></div>
    </div>
    <div class="corpo"></div>
    <div class="rod">
      <div><b>CGPro – Centro de Gestão de Projetos</b> · pge.cgpro@sp.gov.br · Rua Pamplona, 227 – Jardim Paulista, São Paulo-SP</div>
      <div class="r">${anx ? 'Anexo: <span>' + esc(anx) + '</span> · ' : ''}Proposta enviada em ${dataBR(o.fim)}${partes > 1 ? ` · Página ${parte} de ${partes}` : ''}</div>
    </div>
  </div>`;
}

function novoBox(col, num, titulo, red, cont) {
  const b = document.createElement('section');
  b.className = 'box' + (red ? ' red' : '') + (cont ? ' cont' : '');
  b.dataset.num = num; b.dataset.titulo = titulo; b.dataset.red = red ? 1 : 0; b.dataset.cont = cont ? 1 : 0;
  b.innerHTML = `<h3><i>${String(num).padStart(2, '0')}</i>${esc(titulo)}${cont ? ' (cont.)' : ''}</h3>`;
  col.appendChild(b);
  return b;
}

function novoItem(it) {
  if (it.t === 'grp') { const g = document.createElement('div'); g.className = 'grp'; it.parts.forEach(x => g.appendChild(novoItem(x))); return g; }
  const e = document.createElement('div');
  e.className = it.t === 'li' ? 'li' : it.t === 'sub' ? 'sub' : 'p';
  e.innerHTML = it.h;
  return e;
}

/* distribui os blocos nas colunas; retorna false se não couber */
function agrupa(its) {
  const out = [];
  for (let k = 0; k < its.length; k++) {
    if (its[k].t === 'sub' && k + 1 < its.length) { out.push({ t: 'grp', parts: [its[k], its[k + 1]] }); k++; }
    else out.push(its[k]);
  }
  return out;
}

function distribui(corpo, bl, ncols, fs, cap, inteiro) {
  corpo.innerHTML = '';
  corpo.style.setProperty('--fs', fs + 'pt');
  const cols = Array.from({ length: ncols }, () => { const c = document.createElement('div'); c.className = 'col'; c.style.setProperty('--fs', fs + 'pt'); corpo.appendChild(c); return c; });
  const H = cap || cols[0].clientHeight;
  const topo = cols[0].getBoundingClientRect().top;
  const estourou = c => { const u = c.lastElementChild; return !!u && (u.getBoundingClientRect().bottom - topo) > H + 0.5; };
  let ci = 0;
  for (let bi = 0; bi < bl.length; bi++) {
    const [titulo, its, red, num] = bl[bi];
    let box = novoBox(cols[ci], num, titulo, red, false);
    let comItens = 0;
    if (estourou(cols[ci])) {
      box.remove();
      if (++ci >= ncols) return false;
      box = novoBox(cols[ci], num, titulo, red, false);
      if (estourou(cols[ci])) return false;
    }
    if (inteiro) {
      // blocos inteiros, sem quebrar entre colunas
      agrupa(its).forEach(it => box.appendChild(novoItem(it)));
      if (estourou(cols[ci])) {
        box.remove();
        if (++ci >= ncols) return false;
        box = novoBox(cols[ci], num, titulo, red, false);
        agrupa(its).forEach(it => box.appendChild(novoItem(it)));
        if (estourou(cols[ci])) return false;
      }
      continue;
    }
    for (const it of agrupa(its)) {
      const el = novoItem(it);
      box.appendChild(el);
      if (!estourou(cols[ci])) { comItens++; continue; }
      el.remove();
      // evita título órfão: leva o bloco inteiro para a próxima coluna
      if (comItens === 0) { box.remove(); if (++ci >= ncols) return false; box = novoBox(cols[ci], num, titulo, red, false); }
      else { if (++ci >= ncols) return false; box = novoBox(cols[ci], num, titulo, red, true); }
      box.appendChild(el); comItens = 1;
      if (estourou(cols[ci])) return false;
    }
  }
  return true;
}

/* maior fonte (passo 0,25pt) que cabe na página, testando 3 e 4 colunas */
function melhorFonte(corpo, bl, teto) {
  corpo.classList.remove('esticar');
  let melhor = null;
  for (const nc of [3, 4]) {
    let lo = 0, hi = Math.round(((teto || 10) - 4.5) / 0.25);   // índices: fs = 4.5 + i*0.25
    if (!distribui(corpo, bl, nc, 4.5)) continue;
    while (lo < hi) { const m = Math.ceil((lo + hi) / 2); if (distribui(corpo, bl, nc, 4.5 + m * 0.25)) lo = m; else hi = m - 1; }
    const fs = 4.5 + lo * 0.25;
    if (!melhor || fs > melhor.fs) melhor = { fs, nc };
  }
  return melhor || { fs: 4.5, nc: 4 };
}

function ajusta(pg, bl, teto) {
  const corpo = pg.querySelector('.corpo');
  const melhor = melhorFonte(corpo, bl, teto);
  // equilibra as colunas: menor altura que ainda comporta tudo
  corpo.classList.remove('esticar');
  distribui(corpo, bl, melhor.nc, melhor.fs);
  const H = corpo.querySelector('.col').clientHeight;
  // prefere blocos inteiros; só quebra bloco entre colunas se não couber de outro jeito
  const inteiro = distribui(corpo, bl, melhor.nc, melhor.fs, H, true);
  let lo = H * 0.25, hi = H;
  while (hi - lo > 2) { const mid = (lo + hi) / 2; if (distribui(corpo, bl, melhor.nc, melhor.fs, mid, inteiro)) hi = mid; else lo = mid; }
  distribui(corpo, bl, melhor.nc, melhor.fs, hi, inteiro);
  // estica os blocos para alinhar o fim das colunas
  corpo.classList.add('esticar');
  return melhor;
}

/* ---------- render da lista ---------- */
function nomeArquivo(o) {
  const n = String(parseInt(o.id)).padStart(2, '0');
  const t = limpa(o.titulo).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w\- ]/g, '').trim().slice(0, 60);
  return `Proposta ${n} - ${t}`;
}

async function renderiza(lista) {
  const box = $('#lista');
  box.innerHTML = '';
  PROPOSTAS = lista;
  const total = lista.length;
  for (let i = 0; i < lista.length; i++) {
    status(`Montando ${i + 1} de ${total}…`);
    const o = lista[i];
    const card = document.createElement('div');
    card.className = 'card';
    const topo = `<div class="card-top"><b>${String(parseInt(o.id)).padStart(2, '0')} · ${esc(limpa(o.titulo))}</b><span class="info"></span>
      <div class="acts"><button class="btn" data-a="print">Imprimir</button><button class="btn" data-a="pdf">PDF</button><button class="btn" data-a="pptx">PPTX</button></div></div>`;
    card.innerHTML = topo + paginaHTML(o, total, 1, 1);
    box.appendChild(card);
    const bl = blocos(o);
    let r = ajusta(card.querySelector('.pg'), bl), info;
    if (r.fs >= LIMITE_1PAG) {
      info = `· 1 página · fonte ${fmtFs(r.fs)}pt`;
    } else {
      // até 2 páginas: escolhe o ponto de corte (na ordem dos blocos) que deixa a maior fonte
      card.innerHTML = topo + paginaHTML(o, total, 1, 2) + paginaHTML(o, total, 2, 2);
      const [p1, p2] = card.querySelectorAll('.pg');
      let corte = 5, fsMax = 0;
      for (let k = 2; k <= 7; k++) {
        const f = Math.min(melhorFonte(p1.querySelector('.corpo'), bl.slice(0, k)).fs, melhorFonte(p2.querySelector('.corpo'), bl.slice(k)).fs);
        if (f > fsMax) { fsMax = f; corte = k; }
      }
      // mesma fonte nas duas páginas
      const a1 = ajusta(p1, bl.slice(0, corte), fsMax), a2 = ajusta(p2, bl.slice(corte), fsMax);
      r = { fs: Math.min(a1.fs, a2.fs) };
      if (a1.fs !== a2.fs) { ajusta(p1, bl.slice(0, corte), r.fs); ajusta(p2, bl.slice(corte), r.fs); }
      info = `· 2 páginas · fonte ${fmtFs(r.fs)}pt`;
    }
    card.querySelector('.info').innerHTML = info + (r.fs < 6 ? ' <span class="warn">· fonte pequena</span>' : '');
    card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => acaoUm(b.dataset.a, i, card));
    await new Promise(r => setTimeout(r, 0));
  }
  status(`${total} propostas prontas`);
  ['#bNovo', '#bPrint', '#bPdfAll', '#bZip', '#bPptx'].forEach(s => $(s).disabled = false);
  $('#drop').style.display = 'none';
}

/* ---------- PDF (imagem de alta resolução) ---------- */
async function capturaPagina(pg) {
  const c = await html2canvas(pg, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true, logging: false });
  return c.toDataURL('image/jpeg', 0.92);
}
function novoPDF() { return new jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true }); }

async function pdfDe(cards) {
  const doc = novoPDF();
  const pgs = cards.flatMap(c => [...c.querySelectorAll('.pg')]);
  for (let i = 0; i < pgs.length; i++) {
    status(`Gerando PDF: página ${i + 1} de ${pgs.length}…`);
    if (i) doc.addPage();
    doc.addImage(await capturaPagina(pgs[i]), 'JPEG', 0, 0, PAGE_W, PAGE_H);
  }
  return doc;
}

function baixa(blob, nome) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- PowerPoint (editável, posições medidas da página) ---------- */
const hex = c => c.replace('#', '');
function addPaginaPPT(pptx, pg) {
  const base = pg.getBoundingClientRect();
  const R = el => { const r = el.getBoundingClientRect(); return { x: (r.left - base.left) / 96, y: (r.top - base.top) / 96, w: r.width / 96, h: r.height / 96 }; };
  const s = pptx.addSlide();
  s.background = { color: 'FFFFFF' };
  const txt = (el, opt) => { const r = R(el); s.addText(el.innerText.trim(), Object.assign({ x: r.x, y: r.y, w: r.w, h: r.h, margin: 0, fontFace: 'Arial', valign: 'top', fit: 'none' }, opt)); };

  // cabeçalho
  let r = R(pg.querySelector('.lg1')); s.addImage({ data: LOGO_CGPRO, x: r.x, y: r.y, w: r.w, h: r.h });
  r = R(pg.querySelector('.lg2')); s.addImage({ data: LOGO_PGE, x: r.x, y: r.y, w: r.w, h: r.h });
  const num = pg.querySelector('.num');
  r = R(num);
  s.addText([{ text: num.firstChild.textContent, options: { fontSize: 24, bold: true, color: '1D1D1B', breakLine: true } },
             { text: num.querySelector('small').textContent, options: { fontSize: 6.5, bold: true, color: '8A8A8A', charSpacing: 1 } }],
            { x: r.x - .05, y: r.y, w: r.w + .1, h: r.h + .05, margin: 0, align: 'center', fontFace: 'Arial', valign: 'top' });
  const tt = pg.querySelector('.tt'); r = R(tt);
  s.addShape(pptx.ShapeType.rect, { x: r.x, y: r.y, w: 1.2 * MM / 96, h: r.h, fill: { color: 'E3242B' }, line: { type: 'none' } });
  txt(pg.querySelector('.kicker'), { fontSize: 7.5, bold: true, color: 'E3242B', charSpacing: 1, w: R(pg.querySelector('.kicker')).w + .3 });
  txt(pg.querySelector('.titulo'), { fontSize: 13, bold: true, color: '1D1D1B', h: R(pg.querySelector('.titulo')).h + .1 });

  // faixa
  pg.querySelectorAll('.meta > div').forEach((d, i, all) => {
    const rr = R(d);
    s.addShape(pptx.ShapeType.rect, { x: rr.x, y: rr.y, w: rr.w, h: rr.h, fill: { color: i === all.length - 1 ? 'E3242B' : '1D1D1B' }, line: { type: 'none' } });
    s.addText([{ text: d.querySelector('b').textContent.toUpperCase(), options: { fontSize: 5.8, bold: true, color: i === all.length - 1 ? 'FFD6D7' : 'BDBDBB', charSpacing: 1, breakLine: true } },
               { text: d.querySelector('span').textContent, options: { fontSize: 8.5, bold: true, color: 'FFFFFF' } }],
              { x: rr.x + 3 * MM / 96, y: rr.y + 1.2 * MM / 96, w: rr.w - 6 * MM / 96, h: rr.h - 2 * MM / 96, margin: 0, fontFace: 'Arial', valign: 'top' });
  });

  // blocos
  const fs = parseFloat(pg.querySelector('.col').style.getPropertyValue('--fs')) * 0.96;
  pg.querySelectorAll('.box').forEach(b => {
    const rb = R(b);
    s.addShape(pptx.ShapeType.rect, { x: rb.x, y: rb.y, w: rb.w, h: rb.h, fill: { color: 'F5F5F4' }, line: { type: 'none' } });
    s.addShape(pptx.ShapeType.rect, { x: rb.x, y: rb.y, w: rb.w, h: .9 * MM / 96, fill: { color: b.dataset.red === '1' ? 'E3242B' : '1D1D1B' }, line: { type: 'none' } });
    const runs = [
      { text: String(b.dataset.num).padStart(2, '0') + '  ', options: { fontSize: 6.6, bold: true, color: 'E3242B' } },
      { text: b.dataset.titulo.toUpperCase() + (b.dataset.cont === '1' ? ' (CONT.)' : ''), options: { fontSize: 6.6, bold: true, color: '1D1D1B', charSpacing: .6, breakLine: true, paraSpaceAfter: 2 } }
    ];
    b.querySelectorAll('.p, .li, .sub').forEach(el => {
      const t = el.innerText.trim();
      if (el.classList.contains('li')) runs.push({ text: t, options: { fontSize: fs, color: '1D1D1B', bullet: { indent: 8 }, breakLine: true, paraSpaceBefore: 1.5 } });
      else if (el.classList.contains('sub')) runs.push({ text: t.toUpperCase(), options: { fontSize: fs * .85, bold: true, color: '6B6B6B', breakLine: true, paraSpaceBefore: 2 } });
      else runs.push({ text: t, options: { fontSize: fs, color: el.querySelector('.vazio') ? '9B9B9B' : '1D1D1B', italic: !!el.querySelector('.vazio'), breakLine: true, paraSpaceBefore: 1.5 } });
    });
    s.addText(runs, { x: rb.x + 2.2 * MM / 96, y: rb.y + 1.6 * MM / 96, w: rb.w - 4.4 * MM / 96, h: rb.h - 2.6 * MM / 96, margin: 0, fontFace: 'Arial', valign: 'top', lineSpacingMultiple: 1.05, fit: 'none' });
  });

  // rodapé
  const rod = pg.querySelector('.rod'); r = R(rod);
  s.addShape(pptx.ShapeType.line, { x: r.x, y: r.y, w: r.w, h: 0, line: { color: 'E2E2E0', width: .75 } });
  s.addText(rod.children[0].innerText, { x: r.x, y: r.y + .02, w: r.w * .6, h: r.h, margin: 0, fontSize: 6.5, color: '6B6B6B', fontFace: 'Arial', valign: 'middle' });
  s.addText(rod.children[1].innerText, { x: r.x + r.w * .4, y: r.y + .02, w: r.w * .6, h: r.h, margin: 0, fontSize: 6.5, color: '6B6B6B', fontFace: 'Arial', align: 'right', valign: 'middle' });
}

async function pptxDe(cards, nome) {
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name: 'A4L', width: PAGE_W / 25.4, height: PAGE_H / 25.4 });
  pptx.layout = 'A4L';
  pptx.title = 'Propostas – 1º Edital CGPro';
  cards.forEach((c, i) => { status(`Montando slides ${i + 1} de ${cards.length}…`); c.querySelectorAll('.pg').forEach(pg => addPaginaPPT(pptx, pg)); });
  await pptx.writeFile({ fileName: nome + '.pptx' });
}

/* ---------- ações ---------- */
function imprimir(card) {
  document.body.classList.toggle('so-um', !!card);
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('imprimir', c === card));
  window.print();
  setTimeout(() => document.body.classList.remove('so-um'), 500);
}

async function ocupado(fn) {
  const bs = document.querySelectorAll('button'); bs.forEach(b => b.disabled = true);
  try { await fn(); status('Pronto ✓'); }
  catch (e) { console.error(e); status('Erro: ' + e.message); alert('Erro: ' + e.message); }
  finally { bs.forEach(b => b.disabled = false); }
}

function acaoUm(a, i, card) {
  const nome = nomeArquivo(PROPOSTAS[i]);
  if (a === 'print') return imprimir(card);
  if (a === 'pdf') return ocupado(async () => (await pdfDe([card])).save(nome + '.pdf'));
  if (a === 'pptx') return ocupado(() => pptxDe([card], nome));
}

const cardsTodos = () => [...document.querySelectorAll('.card')];
$('#bPrint').onclick = () => imprimir(null);
$('#bPdfAll').onclick = () => ocupado(async () => (await pdfDe(cardsTodos())).save('Propostas CGPro - consolidado.pdf'));
$('#bPptx').onclick = () => ocupado(() => pptxDe(cardsTodos(), 'Propostas CGPro'));
$('#bZip').onclick = () => ocupado(async () => {
  const zip = new JSZip(), cs = cardsTodos();
  for (let i = 0; i < cs.length; i++) {
    status(`Gerando PDF ${i + 1} de ${cs.length}…`);
    const doc = await pdfDe([cs[i]]);
    zip.file(nomeArquivo(PROPOSTAS[i]) + '.pdf', doc.output('blob'));
  }
  status('Compactando…');
  baixa(await zip.generateAsync({ type: 'blob' }), 'Propostas CGPro - individuais.zip');
});
$('#bNovo').onclick = () => { $('#lista').innerHTML = ''; $('#drop').style.display = ''; status(''); ['#bNovo', '#bPrint', '#bPdfAll', '#bZip', '#bPptx'].forEach(s => $(s).disabled = true); $('#arq').value = ''; };

/* ---------- upload ---------- */
async function carrega(file) {
  if (!file) return;
  try {
    status('Lendo planilha…');
    const lista = lerPlanilha(await file.arrayBuffer());
    if (!lista.length) throw new Error('Nenhuma proposta encontrada na planilha.');
    await renderiza(lista);
  } catch (e) { console.error(e); status(''); alert(e.message); }
}
const drop = $('#drop');
drop.onclick = () => $('#arq').click();
$('#arq').onchange = e => carrega(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); carrega(e.dataTransfer.files[0]); };
